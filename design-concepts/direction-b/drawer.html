<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>السلة — درج جانبي · دار سَحَر</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Sans+Arabic:wght@300;400;500&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="diwan.css">
<style>
body{overflow:hidden}
.frame{position:fixed;inset:0;z-index:0}
.frame iframe{width:100%;height:100%;border:none;pointer-events:none}
.drawer{transform:none}
.scrim{opacity:1;pointer-events:auto}
.hint{position:fixed;bottom:18px;inset-inline-start:18px;z-index:90;font-size:.62rem;letter-spacing:.2em;color:var(--faint);background:var(--paper);border:1px solid var(--line2);padding:8px 14px}
</style>
</head>
<body>

<div class="frame"><iframe src="index.html" title="خلفية المتجر"></iframe></div>
<div class="scrim" onclick="location='cart.html'"></div>

<aside class="drawer open" aria-label="سلة المشتريات">
  <div class="dh"><h3>سِلّتُك <span class="lat" style="font-size:.7rem;color:var(--faint)">— ٢</span></h3><button onclick="location='cart.html'">إغلاق ✕</button></div>
  <div class="ditems" id="dItems"></div>
  <div class="dfoot">
    <div class="dtot"><span>الإجمالي<small>شامل الضريبة — الشحن يُحسب عند الدفع</small></span><span class="lat">1,640 ر.س</span></div>
    <a class="btn-ink" href="checkout.html">إتمام الطلب</a>
    <a class="link-u" href="cart.html">عرض السلة كاملة</a>
  </div>
</aside>

<div class="hint">DEMO — الدرج فوق الرئيسية · أي ضغطة على الخلفية تفتح صفحة السلة</div>

<script src="../shared/data.js"></script>
<script src="../shared/bottle.js"></script>
<script>
const cart = [
  { p: SAHAR.prod("sahar-najd"), size: "٥٠ مل", qty: 1, price: 890 },
  { p: SAHAR.prod("amber-nights"), size: "٥٠ مل", qty: 1, price: 680 },
  { p: SAHAR.prod("tahara-royal"), size: "٦ مل", qty: 1, price: 320 },
];
document.getElementById("dItems").innerHTML = cart.map(i=>`
  <div class="ditem">
    <span class="dfig">${bottleSVG(i.p,{mode:"paper",glow:false,scale:.26})}</span>
    <span><span class="dn">${i.p.ar}</span><div class="dv">${i.size} · ${i.p.conc}</div>
      <div class="dqty"><button>−</button><span>${i.qty}</span><button>+</button></div>
      <button class="rm">إزالة</button></span>
    <span class="dp lat">${i.price.toLocaleString("en-US")}</span>
  </div>`).join("");
</script>
</body>
</html>
